<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Vault</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6b63">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f1;--card:#fff;--ink:#16262b;--mut:#5f7075;--line:#d3dbd6;--acc:#0f6b63;--acc2:#e3f1ee;--ok:#1f7a3d;--okbg:#dff3e5;--bad:#b4232c;--badbg:#fbe3e4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="dark"]{--bg:#0f1a1d;--card:#182428;--ink:#e6eeee;--mut:#9fb2b5;--line:#2c3d42;--acc:#4cc2b4;--acc2:#16342f;--ok:#6fd58f;--okbg:#15321f;--bad:#ff8a90;--badbg:#3a1a1d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--card:#182428;--ink:#e6eeee;--mut:#9fb2b5;--line:#2c3d42;--acc:#4cc2b4;--acc2:#16342f;--ok:#6fd58f;--okbg:#15321f;--bad:#ff8a90;--badbg:#3a1a1d}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding:14px 12px 40px}
main{max-width:720px;margin:0 auto}
h1{font:700 1.6rem Georgia,"Times New Roman",serif;letter-spacing:-.01em}
h2{font:700 1.15rem Georgia,serif}
.sub{color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
button,.btn{font:600 .9rem inherit;font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;touch-action:manipulation}
button.p,.btn.p{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button.d{color:var(--bad)}
button:disabled{opacity:.4}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.g{flex:1}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between}
.item .t{min-width:0;flex:1}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.opt:disabled{opacity:1}
.item{flex-wrap:wrap}.tile{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px;margin:8px 0;font-weight:400}.tile b{font-size:1.05rem}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
details.more summary{list-style:none;cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-weight:700}details.more[open]{flex-basis:100%}.menu{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.lnk{border:0;background:none;color:var(--acc);text-decoration:underline;padding:10px 0;font-weight:500}
textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
a.btn{text-decoration:none;display:inline-block}
.why{margin-top:8px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--acc2);border-radius:6px;font-size:.92rem}
.modes button{padding:9px 2px;font-size:.8rem}
.modes button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.q{font:600 1.12rem/1.45 Georgia,serif;margin:6px 0 12px}
.q small{display:block;font:500 .8rem sans-serif;color:var(--mut);margin-bottom:4px}
.fig{display:block;max-width:100%;width:360px;margin:0 auto 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:8px;padding:12px;font-weight:500;align-items:flex-start}
.opt b{flex:0 0 1.4em;color:var(--mut)}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.fb{font-size:.9rem;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:8px}
.grid button{padding:8px 0;font-size:.8rem}
.grid .a{background:var(--acc2)}.grid .r{background:var(--okbg)}.grid .w{background:var(--badbg)}.grid .c{outline:2px solid var(--acc)}
.nav{display:flex;gap:8px;margin-top:12px}.nav button{flex:1}
.big{font:700 2.4rem Georgia,serif}
input[type=number]{font:inherit;width:90px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input.nm{font:inherit;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.drop{border:2px dashed var(--line);text-align:center;padding:22px 12px;border-radius:12px}
.msg{color:var(--bad);font-size:.88rem;margin-top:6px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var LS=[],CS=[],cc=null,cur=null,mode="study",app=document.getElementById("app"),tick=null,memOnly=false,note="";
var MODES={learn:"Learn",study:"Study",exam:"Exam",review:"Review"};
var $=function(s){return document.querySelector(s)};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* storage (IndexedDB, falls back to memory) */
function odb(){return new Promise(function(res,rej){try{var r=indexedDB.open("quizvault",1);r.onupgradeneeded=function(){r.result.createObjectStore("q",{keyPath:"id"})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}})}
function dbOp(kind,val){return odb().then(function(d){return new Promise(function(res,rej){var tx=d.transaction("q",kind==="all"?"readonly":"readwrite"),s=tx.objectStore("q"),r=kind==="all"?s.getAll():kind==="put"?s.put(val):s.delete(val);tx.oncomplete=function(){res(r.result)};tx.onerror=function(){rej(tx.error)}})})}
function save(r){return dbOp("put",r).catch(function(){memOnly=true})}

/* parsing an offline quiz file */
function normQ(a){return a.map(function(t){if(t.options||!(t.q&&t.o))return t;var c=typeof t.a==="string"?t.a.toUpperCase().charCodeAt(0)-65:t.a;return{id:t.id,question:t.q,options:t.o.map(function(x,k){return{letter:String.fromCharCode(65+k),text:x,correct:k===c}}),reason:t.e||""}})}
function extract(txt){var m=/(?:rawQuizData|\bconst\s+Q)\s*=\s*\[/.exec(txt);if(!m)throw new Error("no quiz data");var i=m.index+m[0].length-1,d=0,s=false,e=false;
for(var j=i;j<txt.length;j++){var c=txt[j];if(s){if(e)e=false;else if(c==="\\")e=true;else if(c==='"')s=false;continue}
if(c==='"')s=true;else if(c==="[")d++;else if(c==="]"&&--d===0)return normQ(JSON.parse(txt.slice(i,j+1)))}throw new Error("unfinished data")}
function addFiles(files){var bad=[],jobs=[].map.call(files,function(f){return f.text().then(function(t){var data=extract(t);
if(!data.length||!data[0].options)throw 0;var id="q"+Date.now()+Math.random().toString(36).slice(2,6);
var r={id:id,course:cc==="none"?null:cc,name:f.name.replace(/\.html?$/i,"").replace(/[_-]+/g," "),data:data,added:Date.now(),st:fresh(data)};LS.push(r);return save(r)}).catch(function(){bad.push(f.name)})});
Promise.all(jobs).then(function(){note=bad.length?"Couldn’t read: "+bad.join(", ")+". Pick the quiz .html files that contain the question list.":"";view()})}
function fresh(data){return{order:shuf(data.map(function(q){return q.id})),opt:{},a:{study:{},exam:{},review:{}},i:{study:0,exam:0,review:0},rv:[],ex:{end:0,done:false,mins:Math.ceil(data.length*.8)}}}
function qmap(){var m={};cur.data.forEach(function(q){m[q.id]=q});return m}
function optOrder(q){var st=cur.st;if(!st.opt[q.id]){var ix=q.options.map(function(_,i){return i});st.opt[q.id]=q.keepOrder?ix:shuf(ix)}return st.opt[q.id]}
function ids(){return mode==="review"?cur.st.rv:cur.st.order}
function ans(){return cur.st.a[mode]}
function isRight(q,a){return q.options[a]&&q.options[a].correct}

/* home / library */
function view(){if(cc)courseView();else home()}
var AI=loadAI(),pg="",SHOWN={},SM="",GN={n:30,type:"mcq",name:"",notes:"",comments:"",busy:false};
function loadAI(){var d={p:"class",px:"",code:"",gk:"",dk:"",gm:"gemini-3.8-flash",dm:"deepseek-v4-flash"};try{var x=JSON.parse(localStorage.getItem("qv-ai")||"{}");for(var k in x)d[k]=x[k]}catch(e){}if(d.gm==="gemini-2.5-flash")d.gm="gemini-3.8-flash";return d}
var CFG={px:"",code:""};function srv(){return AI.px||CFG.px}function acode(){return AI.code||CFG.code}
function saveAI(){try{localStorage.setItem("qv-ai",JSON.stringify(AI))}catch(e){}}
function home(){clearInterval(tick);cur=null;cc=null;
var h='<div class="row"><h1 class="g">Quiz Vault</h1><button data-set aria-label="Settings">⚙︎</button></div><div class="row" style="margin:14px 0"><input class="nm g" id="cn" placeholder="Add a course…" aria-label="Course name"><button class="p" data-addc>Add</button></div>';
var un=LS.filter(function(r){return!r.course}).length;
CS.sort(function(a,b){return a.added-b.added}).forEach(function(c){var n=LS.filter(function(r){return r.course===c.id}).length;h+='<button class="card tile" data-course="'+c.id+'"><b>'+esc(c.name)+'</b><span class="sub">'+n+' quiz'+(n===1?'':'zes')+' ›</span></button>'});
if(un)h+='<button class="card tile" data-course="none"><b>Unsorted</b><span class="sub">'+un+' ›</span></button>';
if(!CS.length&&!un)h+='<p class="sub">Add your first course to get started.</p>';
app.innerHTML=h}
function moveSel(r){var o='<option value="">Move to course…</option>';CS.forEach(function(c){if(c.id!==r.course)o+='<option value="'+c.id+'">'+esc(c.name)+'</option>'});return CS.length?'<select class="nm" data-mv="'+r.id+'" aria-label="Move to course">'+o+'</select>':''}
function courseView(){clearInterval(tick);cur=null;var C=cc==="none"?{name:"Unsorted"}:CS.filter(function(x){return x.id===cc})[0];if(!C)return home();var nt=note;note="";
var h='<div class="row"><button data-courses>‹ Back</button>'+(cc==="none"?'':'<details class="more" style="margin-left:auto"><summary>⋯</summary><div class="menu"><input class="nm" value="'+esc(C.name)+'" aria-label="Rename course" data-renc="'+cc+'"><button class="d" data-delc="'+cc+'">Delete course</button></div></details>')+'</div><h1 style="margin:10px 0">'+esc(C.name)+'</h1>';
h+='<div class="row" style="margin-bottom:12px"><button class="p g" data-gen>✨ Generate quiz</button><label class="btn g" style="text-align:center">Import file<input id="fi" type="file" accept=".html,.htm,text/html" multiple hidden></label></div>'+(nt?'<p class="sub" style="margin-bottom:8px"><b>'+esc(nt)+'</b></p>':'');
if(memOnly)h+='<p class="msg">Saving isn’t available in this browser, so quizzes will disappear when you close the page.</p>';
var qs=LS.filter(function(r){return(r.course||"none")===cc}).sort(function(a,b){return a.added-b.added});
if(!qs.length)h+='<p class="sub">No quizzes yet. Generate one or import a file.</p>';
qs.forEach(function(r){h+='<div class="card item"><div class="t"><b>'+esc(r.name)+'</b><span class="sub">'+r.data.length+' questions</span></div><button class="p" data-open="'+r.id+'">Open</button><details class="more"><summary>⋯</summary><div class="menu"><input class="nm" value="'+esc(r.name)+'" aria-label="Rename quiz" data-ren="'+r.id+'">'+moveSel(r)+'<button data-exp="'+r.id+'">Share quiz file</button><button class="d" data-del="'+r.id+'">Delete quiz</button></div></details></div>'});
app.innerHTML=h;$("#fi").onchange=function(e){addFiles(e.target.files)}}

/* AI settings and generation */
function settings(){history.pushState({},"");pg="set";setView()}
function setRd(){var g=AI.p==="gemini",k=$("#ak"),m=$("#am"),ap=$("#ap"),ac=$("#ac");if(ap)AI.px=ap.value.trim();if(ac)AI.code=ac.value.trim();if(k)AI[g?"gk":"dk"]=k.value.trim();if(m&&m.value.trim())AI[g?"gm":"dm"]=m.value.trim()}
function setView(){var P=AI.p,g=P==="gemini";
var h='<div class="row"><button data-courses>‹ Back</button></div><h1 style="margin:10px 0 4px">AI settings</h1><p class="sub">Choose how quizzes get written. Keys and codes stay on this phone.</p><div class="seg" style="margin:12px 0">'+[["class","Built-in"],["gemini","My Gemini key"],["deepseek","DeepSeek key"]].map(function(p){return'<button data-prov="'+p[0]+'" class="'+(P===p[0]?"on":"")+'">'+p[1]+'</button>'}).join("")+'</div>';
if(P==="class")h+='<div class="card"><p>'+(srv()?"✓ Quiz generation is ready. No key needed.":"Quiz generation isn’t set up yet. Ask whoever shared the app, or use your own key.")+'</p><details style="margin-top:10px"><summary class="sub">Advanced: use a different server</summary><input id="ap" class="nm" style="margin-top:8px" placeholder="Server address, https://….workers.dev" value="'+esc(AI.px)+'"><input id="ac" class="nm" style="margin-top:8px" type="password" autocomplete="off" placeholder="Class access code" value="'+esc(AI.code)+'"><button class="p" style="margin-top:12px" data-saveai>Save</button> <button style="margin-top:8px" data-share>Copy share link</button></details>'+(SM?'<p class="sub" style="margin-top:8px">'+esc(SM)+'</p>':'')+'</div>';
else h+='<div class="card"><p class="sub" style="margin-bottom:8px">'+(g?"Get a free key at aistudio.google.com. Gemini reads PDFs, images and text.":"Get a key at platform.deepseek.com. DeepSeek reads text only, so paste notes or use a .txt file.")+'</p><input id="ak" class="nm" type="password" autocomplete="off" placeholder="Paste your API key" value="'+esc(g?AI.gk:AI.dk)+'"><details style="margin-top:10px"><summary class="sub">Advanced: model name</summary><input id="am" class="nm" style="margin-top:8px" value="'+esc(g?AI.gm:AI.dm)+'"></details><button class="p" style="margin-top:12px" data-saveai>Save</button>'+(SM?'<p class="sub" style="margin-top:8px">'+esc(SM)+'</p>':'')+'</div>';
app.innerHTML=h}
function grd(){var e=$("#gn");if(e)GN.n=Math.max(5,Math.min(200,+e.value||30));e=$("#gnm");if(e)GN.name=e.value;e=$("#gc");if(e)GN.comments=e.value;e=$("#gt");if(e)GN.notes=e.value}
function genView(){GN.busy=false;var g=AI.p!=="deepseek";
var h='<div class="row"><button data-courses>‹ Back</button><button style="margin-left:auto" data-set aria-label="Settings">'+(AI.p==="class"?"⚙︎":"⚙︎ "+(g?"Gemini":"DeepSeek"))+'</button></div><h1 style="margin:10px 0">Generate quiz</h1>';
h+='<div class="card"><input id="gnm" class="nm" placeholder="Quiz name, e.g. Week 4 Optics" value="'+esc(GN.name)+'"><div class="row" style="margin-top:10px"><label>Questions <input id="gn" type="number" min="5" max="200" value="'+GN.n+'"></label></div><div class="seg" style="margin-top:10px">'+[["mcq","MCQ"],["theory","Theory"],["mix","Mix"]].map(function(t){return'<button data-gt="'+t[0]+'" class="'+(GN.type===t[0]?"on":"")+'">'+t[1]+'</button>'}).join("")+'</div></div>';
h+='<div class="card"><textarea id="gc" rows="2" placeholder="Optional instructions, e.g. focus on clinical cases">'+esc(GN.comments)+'</textarea><p class="sub" style="margin:10px 0 6px">'+(g?"Attach slides (PDF, images or text), or paste notes:":"Paste your notes, or attach a .txt file:")+'</p><input id="gf" type="file" multiple accept="'+(g?".pdf,.txt,.md,image/*":".txt,.md,text/plain")+'"><textarea id="gt" rows="4" style="margin-top:8px" placeholder="Paste notes here">'+esc(GN.notes)+'</textarea></div>';
h+='<button class="p" style="width:100%" data-run>Generate</button><p class="sub" id="gmsg" style="margin-top:10px"></p><button class="lnk" data-man>No key? Use a chatbot manually</button>';
app.innerHTML=h}
function GM(t){var e=$("#gmsg");if(e)e.textContent=t}
function b64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(",")[1])};r.onerror=rej;r.readAsDataURL(f)})}
function tmo(){var c=new AbortController();setTimeout(function(){c.abort()},150000);return c.signal}
function rj(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error((j.error&&(j.error.message||j.error))||("HTTP "+r.status));e.status=r.status;throw e}return j})}
function callG(p,media){return callG1(p,media,true).catch(function(e){if(e.status===400&&/think/i.test(e.message||""))return callG1(p,media,false);throw e})}
function callG1(p,media,th){var cl=AI.p==="class";return fetch(cl?srv():"https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(AI.gm)+":generateContent",{method:"POST",signal:tmo(),headers:cl?{"Content-Type":"application/json","x-access-code":acode()}:{"Content-Type":"application/json","x-goog-api-key":AI.gk},body:JSON.stringify({contents:[{role:"user",parts:media.concat([{text:p}])}],generationConfig:th?{responseMimeType:"application/json",thinkingConfig:{thinkingLevel:"low"}}:{responseMimeType:"application/json"}})}).then(rj).then(function(j){if(j.error){var er=new Error(j.error.message||"The AI returned an error");er.status=j.error.code;throw er}var c=j.candidates&&j.candidates[0];if(!c||!c.content)throw new Error("The AI returned nothing. Try again.");return c.content.parts.map(function(x){return x.text||""}).join("")})}
function callD(p){return fetch("https://api.deepseek.com/chat/completions",{method:"POST",signal:tmo(),headers:{"Content-Type":"application/json","Authorization":"Bearer "+AI.dk},body:JSON.stringify({model:AI.dm,messages:[{role:"system",content:"You write exam questions and reply with JSON only."},{role:"user",content:p}],response_format:{type:"json_object"},stream:false})}).then(rj).then(function(j){return j.choices[0].message.content})}
function callRetry(fn,n){return fn().catch(function(e){if(e.status===429&&n>0){GM("Rate limit reached. Waiting 20 seconds…");return new Promise(function(r){setTimeout(r,20000)}).then(function(){return callRetry(fn,n-1)})}throw e})}
function errMsg(e){var m=e.message||"";if(e.name==="AbortError")return"That took too long. Try fewer questions or a smaller file.";if(e.status===524||e.status===504||/^HTTP 52/.test(m))return"The AI took too long to answer. Try fewer questions or a smaller file.";if(e.status===401||e.status===403||/API key/i.test(m))return AI.p==="class"?"The access code was rejected. Ask whoever shared the app.":"Your key was rejected. Check it in AI settings.";if(e.status===429)return"Rate limit reached. Wait a minute, or ask for fewer questions.";if(e instanceof TypeError)return"Couldn’t reach the AI. Check your internet"+(AI.p==="deepseek"?". DeepSeek may block requests from a web app, so try Gemini.":".");if(/no longer available|not found|not supported/i.test(m))return"That AI model isn’t available any more. Open AI settings, then Advanced, and change the model name.";return m.slice(0,200)}
function genPrompt(cnt,mat,acc){var t=GN.type,sp=t==="mcq"?"All questions are multiple choice.":t==="theory"?"All questions are theory (written-answer) questions.":"Make about 70% multiple choice and 30% theory questions, mixed together.";
var ex=acc.length?" You already wrote these, so write NEW questions on other parts of the material and never repeat or reword them: "+acc.slice(-60).map(function(q){return q.question.slice(0,60)}).join(" | ")+".":"";
return "Use ONLY the lecture material provided. Write exactly "+cnt+" questions that test understanding, not just recall. "+sp+(GN.comments?" Extra instructions from the student: "+GN.comments+".":"")+ex+" Reply with ONLY a JSON object {\"questions\":[...]}. Multiple choice item: {\"type\":\"mcq\",\"question\":\"...\",\"options\":[\"...\",\"...\",\"...\",\"...\"],\"answer\":\"B\",\"reason\":\"one short sentence\"} with exactly 4 options, exactly 1 correct, and no letters inside the option text. Theory item: {\"type\":\"theory\",\"question\":\"...\",\"answer\":\"concise model answer in 2 to 4 sentences\",\"reason\":\"\"}."+(mat?"\n\nLECTURE MATERIAL:\n"+mat:"")}
function genRun(){grd();if(GN.busy)return;var g=AI.p!=="deepseek",cl=AI.p==="class",key=cl?srv():g?AI.gk:AI.dk;if(!key){GM(cl?"Quiz generation isn’t set up yet. Ask whoever shared the app with you, or add your own key in AI settings.":"Add your "+(g?"Gemini":"DeepSeek")+" key in AI settings first.");return}
var files=[].slice.call(($("#gf")||{}).files||[]),texts=[],media=[],tm=null,btn=$("[data-run]");GN.busy=true;if(btn)btn.disabled=true;GM("Reading your material…");
Promise.all(files.map(function(f){if(/\.(txt|md)$/i.test(f.name)||/^text\//.test(f.type))return f.text().then(function(t){texts.push(t)});
if(!g)throw new Error("DeepSeek can’t read PDFs or images. Paste the text instead, or switch to Gemini.");
if(f.size>12e6)throw new Error(f.name+" is too large. Keep each file under about 12 MB.");
return b64(f).then(function(d){media.push({inline_data:{mime_type:f.type||"application/pdf",data:d}})})})).then(function(){
var mat=(GN.notes+"\n"+texts.join("\n")).trim().slice(0,120000);if(!mat&&!media.length)throw new Error("Add your slides or paste some notes first.");
var acc=[],seen={},fails=0,tries=0,max=Math.ceil(GN.n/12)+3,err=null,t0=Date.now();tm=setInterval(function(){var e=$("#gmsg");if(e&&GN.busy)e.textContent="Writing questions… "+acc.length+" of "+GN.n+" ("+Math.round((Date.now()-t0)/1000)+"s)"},1000);
function step(){if(acc.length>=GN.n||tries>=max||fails>=2)return Promise.resolve();tries++;var cnt=Math.min(12,GN.n-acc.length);GM("Writing questions… "+acc.length+" of "+GN.n);
return callRetry(function(){return g?callG(genPrompt(cnt,mat,acc),media):callD(genPrompt(cnt,mat,acc))},1).then(function(txt){var r=parseQ(txt);if(r.err||!r.good.length){fails++;return step()}fails=0;r.good.forEach(function(q){var k=q.question.toLowerCase();if(!seen[k]&&acc.length<GN.n){seen[k]=1;acc.push(q)}});return step()})}
return step().catch(function(e){err=e}).then(function(){clearInterval(tm);
if(!acc.length){GN.busy=false;if(btn)btn.disabled=false;GM(err?errMsg(err):"The AI didn’t return usable questions. Try again, or ask for fewer.");return}
acc.forEach(function(q,i){q.id=i+1});var rec={id:"q"+Date.now()+Math.random().toString(36).slice(2,6),course:cc==="none"?null:cc,name:GN.name.trim()||"Generated quiz "+new Date().toLocaleDateString(),data:acc,added:Date.now(),st:fresh(acc)};LS.push(rec);save(rec);
note="Saved “"+rec.name+"” with "+acc.length+" questions"+(acc.length<GN.n?" (you asked for "+GN.n+(err?"; stopped: "+errMsg(err):"")+")":"")+".";GN.name="";GN.notes="";history.back()})
}).catch(function(e){clearInterval(tm);GN.busy=false;if(btn)btn.disabled=false;GM(errMsg(e))})}
function exp(r){if(!r)return;var html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(r.name)+'</title></head><body><script>const rawQuizData = '+JSON.stringify(r.data).replace(/</g,"\\u003c")+';<\/script></body></html>',fn=(r.name.replace(/[^\w\- ]+/g,"").trim()||"quiz")+".html",f=new File([html],fn,{type:"text/html"});
if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:r.name}).catch(function(){});return}
var a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=fn;document.body.appendChild(a);a.click();a.remove()}
function theoryBlock(q,sel){var open=mode==="learn"||sel!=null||SHOWN[q.id];if(!open)return'<button class="p" data-ts="'+q.id+'">Show model answer</button>';return'<div class="why"><b>Model answer:</b> '+esc(q.answer)+'</div>'+(mode==="learn"?"":'<div class="row" style="margin-top:10px"><button class="g'+(sel===1?" p":"")+'" data-pick="1">Got it</button><button class="g'+(sel===0?" d":"")+'" data-pick="0">Missed it</button></div>')}

/* create from notes */
var MK={n:30,name:"",text:"",res:null,msg:"",info:"",acc:[]},mk=false;
function rd(){var a=$("#mt");if(a)MK.text=a.value;var n=$("#mn");if(n)MK.n=Math.max(5,Math.min(60,+n.value||30));var m=$("#mnm");if(m)MK.name=m.value}
function mkPrompt(){var ex=MK.acc.length?"\nYou already wrote the questions listed below. Write NEW questions on different parts of the material. Do not repeat or reword any of them:\n"+MK.acc.map(function(q){return"- "+q.question.slice(0,70)}).join("\n"):"";
return "Use ONLY the attached lecture material. Write "+MK.n+" multiple-choice questions that test understanding, not just word recall.\nRules: exactly 4 options per question and exactly 1 correct answer; do not put letters like A) inside the option text; \"answer\" is the letter A, B, C or D; \"reason\" is one short sentence (under 25 words) based on the material."+ex+"\nReply with ONLY a JSON array inside one code block, with no other text, in this format:\n[{\"question\":\"...\",\"options\":[\"...\",\"...\",\"...\",\"...\"],\"answer\":\"B\",\"reason\":\"...\"}]"}
function copyTxt(t){return(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t):Promise.reject()).catch(function(){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}x.remove();if(!ok)throw 0})}
function parseQ(raw){var t=raw.replace(/```[a-z]*/gi,"").trim(),a=t.indexOf("["),b=t.lastIndexOf("]");if(a<0||b<a)return{err:"I couldn’t find a question list. Paste the whole reply, including the [ and ] brackets."};
t=t.slice(a,b+1);var arr;try{arr=JSON.parse(t)}catch(e){try{arr=JSON.parse(t.replace(/,\s*([\]}])/g,"$1"))}catch(e2){var m=/position (\d+)/.exec(e2.message),n=m?(t.slice(0,+m[1]).match(/"question"/gi)||[]).length:0;return{err:"The list has a formatting error"+(n?" near question "+n:"")+". Ask the chatbot: “Fix the JSON formatting and send the full list again.”"}}}
if(!Array.isArray(arr))return{err:"That isn’t a list of questions."};
var good=[],bad=[];arr.forEach(function(o,i){var n=i+1,q=String(o.question||o.q||"").trim(),op=o.options||o.choices;if(op&&!Array.isArray(op))op=Object.keys(op).map(function(k){return op[k]});
if((o.type||"").toLowerCase()==="theory"){var ta=String(o.answer||o.model_answer||"").trim();if(!q||!ta){bad.push("Q"+n+": missing question or answer");return}good.push({id:good.length+1,type:"theory",question:q,answer:ta,reason:String(o.reason||"").trim(),options:[{letter:"✗",text:"Missed it",correct:false},{letter:"✓",text:"Got it",correct:true}]});return}
if(!q||!Array.isArray(op)||op.length<2){bad.push("Q"+n+": missing question or options");return}
op=op.map(function(x){return String(x).replace(/^\(?[A-F][\).:]\s+/,"").trim()});
var s=String(o.answer!=null?o.answer:o.correct!=null?o.correct:o.correct_answer).trim(),ix=-1;
if(/^[A-F]$/i.test(s)||/^\(?[A-F][\).:]/i.test(s))ix=/([A-F])/i.exec(s)[1].toUpperCase().charCodeAt(0)-65;else ix=op.findIndex(function(x){return x.toLowerCase()===s.toLowerCase()});
if(ix<0||ix>=op.length){bad.push("Q"+n+": couldn’t match the answer “"+s.slice(0,20)+"”");return}
good.push({id:good.length+1,question:q,options:op.map(function(x,k){return{letter:String.fromCharCode(65+k),text:x,correct:k===ix}}),reason:String(o.reason||o.explanation||o.rationale||"").trim()})});
return{good:good,bad:bad}}
function ck(skip){if(!skip)rd();var r=parseQ(MK.text);if(r.err){MK.res=null;MK.msg=r.err}else if(!r.good.length){MK.res=null;MK.msg="No usable questions found. "+r.bad.slice(0,3).join("; ")}else{MK.res=r;MK.msg=""}mkView()}
function maker(){history.replaceState({},"");mk=true;MK.acc=[];MK.res=null;MK.msg="";MK.info="";mkView()}
function mkView(){var r=MK.res,h='<div class="row"><button data-courses>‹ Back</button></div><h1 style="margin:10px 0 4px">Create from notes</h1><p class="sub">Use DeepSeek or any chatbot to write the questions, then paste them here.</p>';
h+='<div class="card"><p><b>1. Set up</b></p><p class="sub">For a big quiz, do several batches of 30 to 50. Chatbots slip on very long replies.</p><div class="row" style="margin:8px 0"><label>Questions per batch <input id="mn" type="number" min="5" max="60" value="'+MK.n+'"></label></div><input id="mnm" class="nm" placeholder="Quiz name, e.g. Week 4 Optics" value="'+esc(MK.name)+'"></div>';
h+='<div class="card"><p><b>2. Ask the chatbot</b></p><p class="sub" style="margin:4px 0 10px">Copy the prompt, open DeepSeek, attach your slides, paste the prompt and send.</p><div class="row"><button class="p" data-cp>Copy prompt</button><a class="btn" href="https://chat.deepseek.com" target="_blank" rel="noopener">Open DeepSeek</a></div>'+(MK.info?'<p class="sub" style="margin-top:8px">'+esc(MK.info)+'</p>':'')+'</div>';
h+='<div class="card"><p><b>3. Paste the reply</b></p><p class="sub" style="margin:4px 0 10px">Copy the chatbot’s whole reply, then come back here.</p><textarea id="mt" rows="6" placeholder="Paste the reply here">'+esc(MK.text)+'</textarea><div class="row" style="margin-top:8px"><button class="p" data-pc>Paste from clipboard</button><button data-ck>Check questions</button></div>'+(MK.msg?'<p class="msg">'+esc(MK.msg)+'</p>':'')+'</div>';
if(MK.acc.length)h+='<div class="card"><p><b>'+MK.acc.length+' questions collected so far</b></p><p class="sub" style="margin:4px 0 8px">Copy the prompt again for more. It asks for new questions only.</p>'+(r?'':'<button class="p" data-sv>Save these</button>')+'</div>';
if(r){var q=r.good[0];h+='<div class="card"><p><b>'+r.good.length+' questions ready</b></p>'+(r.bad.length?'<p class="msg">Skipped: '+esc(r.bad.slice(0,5).join("; "))+(r.bad.length>5?"…":"")+'</p>':'')+'<p class="q" style="margin-top:10px">'+esc(q.question)+'</p>'+q.options.map(function(o){return'<p class="fb">'+(o.correct?"✓ <b>":"")+esc(o.letter+") "+o.text)+(o.correct?"</b>":"")+'</p>'}).join("")+(q.reason?'<p class="why"><b>Why:</b> '+esc(q.reason)+'</p>':'')+'<div class="row" style="margin-top:12px"><button class="p g" data-sv>Save to course</button><button data-more>Add and keep going</button><button data-dl>Download file</button></div></div>'}
app.innerHTML=h}
function mkAll(){var seen={};var all=MK.acc.concat(MK.res?MK.res.good:[]).filter(function(q){var k=q.question.toLowerCase();if(seen[k])return false;seen[k]=1;return true});all.forEach(function(q,i){q.id=i+1});return all}
function mkMore(){rd();if(!MK.res)return;MK.acc=mkAll();MK.res=null;MK.text="";MK.msg="";MK.info="Added. You now have "+MK.acc.length+" questions. Copy the prompt again for more.";mkView()}
function mkSave(){rd();var all=mkAll();if(!all.length)return;var rec={id:"q"+Date.now()+Math.random().toString(36).slice(2,6),course:cc==="none"?null:cc,name:MK.name.trim()||"Notes quiz "+new Date().toLocaleDateString(),data:all,added:Date.now(),st:fresh(all)};LS.push(rec);save(rec);MK={n:30,name:"",text:"",res:null,msg:"",info:"",acc:[]};history.back()}
function mkDl(){var b=new Blob(['<!DOCTYPE html><html><head><meta charset="utf-8"><title>Quiz</title></head><body><script>const rawQuizData = '+JSON.stringify(mkAll())+';<\/script></body></html>'],{type:"text/html"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(MK.name.trim()||"notes-quiz")+".html";document.body.appendChild(a);a.click();a.remove()}

/* quiz screen */
function open(id){SHOWN={};cur=LS.filter(function(r){return r.id===id})[0];mode=cur.st.mode||"study";setMode(mode,true)}
function setMode(m,quiet){clearInterval(tick);mode=m;cur.st.mode=m;var st=cur.st;
if(m==="review"&&!Object.keys(st.a.review).length){var qm=qmap(),bad={};["study","exam"].forEach(function(k){Object.keys(st.a[k]).forEach(function(i){if(!isRight(qm[i],st.a[k][i]))bad[i]=1})});st.rv=st.order.filter(function(i){return bad[i]});st.i.review=0}
if(!quiet)save(cur);quiz()}
function reshuffle(){var st=cur.st,any=Object.keys(st.a.study).length+Object.keys(st.a.exam).length+Object.keys(st.a.review).length;
if(any&&!confirm("Reshuffle and clear your answers for this quiz?"))return;var mins=st.ex.mins,md=st.mode;cur.st=fresh(cur.data);cur.st.ex.mins=mins;cur.st.mode=md;save(cur);setMode(md,true)}
function tally(){var qm=qmap(),a=ans(),c=0,n=0;ids().forEach(function(i){if(a[i]!=null){n++;if(isRight(qm[i],a[i]))c++}});return[c,n]}

function quiz(){var st=cur.st;st.a.learn=st.a.learn||{};st.i.learn=st.i.learn||0;var list=ids(),total=list.length,t=tally();
var h='<div class="top"><div class="row"><button data-home>‹ Quizzes</button><b class="g" style="text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(cur.name)+'</b><button data-shuf>Reshuffle</button></div><div class="modes">';
for(var k in MODES)h+='<button class="'+(k===mode?"on":"")+'" data-mode="'+k+'">'+MODES[k]+'</button>';
h+='</div><div class="bar"><i style="width:'+(total?(mode==="learn"?(Math.min(st.i.learn,total-1)+1):t[1])/total*100:0)+'%"></i></div><div class="row sub" style="justify-content:space-between;margin-top:4px"><span>'+(mode==="exam"?'<span id="tm"></span>':mode==="learn"?'Answers shown':t[0]+' / '+t[1]+' correct')+'</span><span>'+(mode==="learn"?(Math.min(st.i.learn,total-1)+1)+' of '+total:t[1]+' of '+total+' answered')+'</span></div></div>';
if(mode==="exam"&&st.ex.done){app.innerHTML=h+result();return}
if(mode==="exam"&&!st.ex.end){h+='<div class="card"><h2>Exam mode</h2><p class="sub" style="margin:6px 0 12px">No feedback until you submit. The timer starts when you press Start.</p><div class="row"><label>Minutes <input id="mins" type="number" min="1" max="600" value="'+st.ex.mins+'"></label><button class="p" data-start>Start exam</button></div></div>';app.innerHTML=h;return}
if(!total){h+='<div class="card"><h2>Nothing to review yet</h2><p class="sub" style="margin-top:6px">Answer some questions in Study or Exam mode. Anything you get wrong will appear here.</p></div>';app.innerHTML=h;return}
var i=Math.min(st.i[mode],total-1),qm=qmap(),q=qm[list[i]],a=ans(),sel=a[q.id],reveal=mode==="learn"||(mode!=="exam"&&sel!=null),why=q.reason||q.explanation||q.rationale;
h+='<div class="card"><div class="q"><small>Question '+(i+1)+' of '+total+' · #'+q.id+'</small>'+esc(q.question)+'</div>'+(q.image?'<img class="fig" alt="Figure for question '+q.id+'" src="'+q.image+'">':'');
if(q.type==="theory")h+=theoryBlock(q,sel);else optOrder(q).forEach(function(oi,p){var o=q.options[oi],c="opt";
if(reveal){if(o.correct)c+=" ok";else if(oi===sel)c+=" no"}else if(oi===sel)c+=" sel";
h+='<button class="'+c+'" data-pick="'+oi+'"'+(reveal?" disabled":"")+'><b>'+String.fromCharCode(65+p)+'</b><span>'+esc(o.text)+'</span></button>'});
if(reveal&&mode!=="learn"&&q.type!=="theory")h+='<p class="fb"><b>'+(isRight(q,sel)?"Correct.":"Not quite. The answer is highlighted in green.")+'</b></p>';
if(reveal)h+=why?'<p class="why"><b>Why:</b> '+esc(why)+'</p>':mode==="learn"?'<p class="sub" style="margin-top:8px">No reason saved for this question yet.</p>':'';
h+='</div><div class="nav"><button data-go="-1"'+(i?"":" disabled")+'>‹ Previous</button><button class="p" data-go="1"'+(i<total-1?"":" disabled")+'>Next ›</button></div>';
if(mode==="exam")h+='<div class="nav"><button data-submit>Submit exam</button></div>';
h+='<details class="card"><summary>Jump to a question</summary><div class="grid">';
list.forEach(function(id,j){var v=a[id],c=v==null?"":mode==="exam"?"a":isRight(qm[id],v)?"r":"w";if(j===i)c+=" c";h+='<button class="'+c+'" data-jump="'+j+'">'+(j+1)+'</button>'});
h+='</div></details>';app.innerHTML=h;if(mode==="exam")runTimer()}

function runTimer(){var st=cur.st;function f(){var s=Math.max(0,Math.round((st.ex.end-Date.now())/1000)),e=$("#tm");if(e)e.textContent="⏱ "+Math.floor(s/60)+":"+("0"+s%60).slice(-2)+" left";if(s<=0){clearInterval(tick);submit(true)}}f();clearInterval(tick);tick=setInterval(f,1000)}
function submit(auto){if(!auto&&!confirm("Submit the exam now?"))return;cur.st.ex.done=true;clearInterval(tick);save(cur);quiz()}
function result(){var t=tally(),n=ids().length,p=n?Math.round(t[0]/n*100):0,un=n-t[1],qm=qmap(),a=ans();
var wrong=ids().filter(function(i){return a[i]!=null&&!isRight(qm[i],a[i])}).length;
return '<div class="card" style="text-align:center"><p class="sub">Exam result</p><p class="big">'+p+'%</p><p>'+t[0]+' of '+n+' correct · '+wrong+' wrong · '+un+' unanswered</p></div><div class="nav"><button class="p" data-mode="review">Review mistakes</button><button data-shuf>Retake</button></div>'}

if(d.course){history.pushState({},"");cc=d.course;return courseView()}

if("share" in d){setRd();saveAI();if(!AI.px||!AI.code){SM="Enter the server address and access code first.";return setView()}var u=location.origin+location.pathname+"#p="+encodeURIComponent(AI.px)+"&c="+encodeURIComponent(AI.code);return copyTxt(u).then(function(){SM="Link copied. Send it to your coursemates.";setView()}).catch(function(){SM=u;setView()})}

if("ck" in d)return ck();

if("more" in d)return mkMore();

if(d.open){history.pushState({},"");return open(d.open)}
if(d.del){var r=LS.filter(function(x){return x.id===d.del})[0];if(confirm("Delete “"+r.name+"” and its progress?")){LS=LS.filter(function(x){return x!==r});dbOp("del",r.id).catch(function(){});courseView()}return}
if("home" in d)return history.back();

if("start" in d){var m=parseInt($("#mins").value,10)||st.ex.mins;st.ex.mins=m;st.ex.end=Date.now()+m*60000;save(cur);return quiz()}

(function(){var m=location.hash,p=/[#&]p=([^&]+)/.exec(m),c=/[#&]c=([^&]+)/.exec(m);if(p&&c){AI.px=decodeURIComponent(p[1]);AI.code=decodeURIComponent(c[1]);AI.p="class";saveAI();history.replaceState(null,"",location.pathname+location.search);alert("Connected. You can now generate quizzes.")}})();
fetch("config.json",{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}).then(function(j){CFG.px=j.server||"";CFG.code=j.code||""}).catch(function(){});
try{navigator.storage.persist()}catch(e){}
